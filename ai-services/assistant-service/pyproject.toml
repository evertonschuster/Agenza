[project]
name = "assistant-service"
version = "0.1.0"
description = "Tenant-aware AI assistant service boundary (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.auth"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus import sorting, bugbear, and pyupgrade -
# keeps the linter useful without fighting FastAPI idioms.
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
