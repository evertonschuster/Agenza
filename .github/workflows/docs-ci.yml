name: Documentation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test documentation checker
        run: node --test scripts/checkDocs.test.mjs

      - name: Check documentation references
        run: npm run check:docs
