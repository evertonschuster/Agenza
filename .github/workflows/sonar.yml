# SonarQube Cloud analysis - free for public repositories.
#
# One-time setup:
#   1. Sign in at https://sonarcloud.io with GitHub and import the repo.
#   2. Create it as a monorepo under organization evertonschuster with three projects:
#        agenza-frontend / agenza-backend / agenza-ai-services
#      (adjust the projectKey args below if you pick different keys).
#   3. Disable "Automatic Analysis" for each project (Administration >
#      Analysis Method) - it conflicts with CI-based analysis.
#   4. Create a token (My Account > Security) and add it as the SONAR_TOKEN repository secret.
#
# Until SONAR_TOKEN exists, every job here skips instead of failing, so
# merging this workflow before the SonarCloud setup is safe.
#
# The agenza-frontend project is analyzed by frontend-ci.yml, right after its tests, so the
# suite runs once.
name: Sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-token:
    name: sonar-check-token
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN secret is not configured - skipping Sonar analysis."
          fi

  backend:
    name: sonar-backend
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the Sonar report comment
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100'

      # The Sonar scanner for .NET runs on Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Sonar scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"agenza-backend"
          /o:"evertonschuster"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.scanner.scanAll=false
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build backend/AdminBackend.slnx -c Release

      - name: Test with coverage (OpenCover format for Sonar)
        run: >
          dotnet test backend/AdminBackend.slnx -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=opencover

      # With qualitygate.wait, a failed quality gate fails this step.
      - name: End analysis
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Sonar report
        if: always() && steps.sonar.conclusion != 'skipped' && steps.sonar.conclusion != ''
        uses: ./.github/actions/sonar-report
        with:
          project-key: agenza-backend
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ github.token }}

  ai-services:
    name: sonar-ai-services
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the Sonar report comment
    defaults:
      run:
        working-directory: ai-services/assistant-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: 'pip'
          cache-dependency-path: ai-services/assistant-service/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test with coverage (produces coverage.xml)
        run: pytest --cov-report=xml

      - name: Sonar analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ai-services/assistant-service
          args: >
            -Dsonar.organization=evertonschuster
            -Dsonar.projectKey=agenza-ai-services
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: Sonar report
        if: always() && steps.sonar.conclusion != 'skipped' && steps.sonar.conclusion != ''
        uses: ./.github/actions/sonar-report
        with:
          project-key: agenza-ai-services
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ github.token }}
