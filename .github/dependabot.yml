version: 2
updates:
  # JS/TS — root lockfile covers all npm workspaces (apps/*, packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-all:
        update-types: [major, minor, patch]

  # .NET — every csproj under backend/ is discovered from here
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: monthly
    groups:
      nuget-all:
        update-types: [major, minor, patch]

  - package-ecosystem: pip
    directory: /ai-services/assistant-service
    schedule:
      interval: monthly
    groups:
      pip-all:
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-all:
        update-types: [major, minor, patch]
