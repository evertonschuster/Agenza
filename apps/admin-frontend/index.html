<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Agenza Admin</title>
    <script>
      (() => {
        const storageKey = 'admin-theme';
        const root = document.documentElement;
        const requestedTheme = root.dataset.theme;
        let storedChoice = null;

        try {
          storedChoice = localStorage.getItem(storageKey);
        } catch {
          storedChoice = null;
        }

        const resolveFromSystem = () =>
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        const theme =
          storedChoice === 'light' || storedChoice === 'dark'
            ? storedChoice
            : storedChoice === 'system'
              ? resolveFromSystem()
              : requestedTheme === 'light' || requestedTheme === 'dark'
                ? requestedTheme
                : resolveFromSystem();

        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#111318' : '#f5f6f8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
